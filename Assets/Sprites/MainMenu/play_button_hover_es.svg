    </g>
    <g transform="translate(19,7)">
      <rect x="0" y="0" width="1" height="6"/><rect x="2" y="0" width="1" height="6"/><rect x="1" y="5" width="1" height="1"/>
    </g>
    <g transform="translate(23,7)">
      <rect x="0" y="0" width="1" height="6"/><rect x="1" y="0" width="2" height="1"/><rect x="1" y="3" width="2" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="1" y="5" width="2" height="1"/>
    </g>
    <g transform="translate(27,7)">
      <rect x="1" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="5"/><rect x="2" y="1" width="1" height="5"/><rect x="1" y="3" width="1" height="1"/>
    </g>
    <g transform="translate(31,7)">
      <rect x="0" y="0" width="1" height="6"/><rect x="1" y="0" width="1" height="1"/><rect x="2" y="1" width="1" height="2"/><rect x="1" y="3" width="1" height="1"/><rect x="2" y="4" width="1" height="2"/>
    </g>
  </g>
  <!-- Icon: play triangle -->
  <g fill="#00ffd1">
    <rect x="9" y="6" width="1" height="7"/>
    <rect x="10" y="7" width="1" height="5"/>
    <rect x="11" y="8" width="1" height="3"/>
    <rect x="12" y="9" width="1" height="1"/>
