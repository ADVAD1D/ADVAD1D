    </g>
    <g transform="translate(31,7)">
      <rect x="0" y="0" width="1" height="6"/><rect x="1" y="0" width="1" height="1"/><rect x="2" y="1" width="1" height="2"/><rect x="1" y="3" width="1" height="1"/><rect x="2" y="4" width="1" height="2"/>
