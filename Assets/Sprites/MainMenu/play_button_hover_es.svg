    </g>
    <g transform="translate(23,7)">
      <rect x="0" y="0" width="1" height="6"/><rect x="1" y="0" width="2" height="1"/><rect x="1" y="3" width="2" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="1" y="5" width="2" height="1"/>
    </g>
    <g transform="translate(27,7)">
