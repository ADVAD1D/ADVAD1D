<svg xmlns="http://www.w3.org/2000/svg" width="50" height="20" viewBox="0 0 50 20" shape-rendering="crispEdges">
  <!-- Spanish version (made from play_button_hover.svg). Main menu PLAY button, hover / focus / pressed state: lit screen, bright text,
       a faint halo around the frame and corner brackets. -->
  <!-- Halo and corner brackets (outside the frame) -->
  <g fill="#00ffd1" fill-opacity="0.25">
    <rect x="4" y="0" width="42" height="1"/>
    <rect x="4" y="19" width="42" height="1"/>
    <rect x="1" y="3" width="1" height="14"/>
    <rect x="48" y="3" width="1" height="14"/>
    <rect x="3" y="1" width="1" height="1"/>
    <rect x="46" y="1" width="1" height="1"/>
    <rect x="2" y="2" width="1" height="1"/>
    <rect x="47" y="2" width="1" height="1"/>
    <rect x="2" y="17" width="1" height="1"/>
    <rect x="47" y="17" width="1" height="1"/>
    <rect x="3" y="18" width="1" height="1"/>
    <rect x="46" y="18" width="1" height="1"/>
  </g>
  <g fill="#00ffd1">
    <rect x="0" y="0" width="3" height="1"/><rect x="0" y="1" width="1" height="2"/>
    <rect x="47" y="0" width="3" height="1"/><rect x="49" y="1" width="1" height="2"/>
    <rect x="0" y="19" width="3" height="1"/><rect x="0" y="17" width="1" height="2"/>
    <rect x="47" y="19" width="3" height="1"/><rect x="49" y="17" width="1" height="2"/>
  </g>
  <!-- Frame: cyan outline, metal bevel -->
  <rect x="4" y="1" width="42" height="18" fill="#00ffd1"/>
  <rect x="3" y="2" width="44" height="16" fill="#00ffd1"/>
  <rect x="2" y="3" width="46" height="14" fill="#00ffd1"/>
  <rect x="4" y="2" width="42" height="1" fill="#528080"/>
  <rect x="3" y="3" width="44" height="14" fill="#528080"/>
  <rect x="4" y="17" width="42" height="1" fill="#3a5757"/>
  <rect x="4" y="3" width="42" height="13" fill="#8db4ae"/>
  <rect x="4" y="16" width="42" height="1" fill="#627a76"/>
  <rect x="4" y="3" width="1" height="1" fill="#dbf3f0"/>
  <rect x="45" y="3" width="1" height="1" fill="#dbf3f0"/>
  <rect x="4" y="16" width="1" height="1" fill="#dbf3f0"/>
  <rect x="45" y="16" width="1" height="1" fill="#dbf3f0"/>
  <rect x="5" y="4" width="40" height="11" fill="#456e67"/>
  <rect x="5" y="15" width="40" height="1" fill="#2b4641"/>
  <!-- Rivets and vent grille -->
  <rect x="6" y="2" width="1" height="1" fill="#dbf3f0"/>
  <rect x="43" y="2" width="1" height="1" fill="#dbf3f0"/>
  <g fill="#627a76">
    <rect x="6" y="17" width="1" height="1"/>
    <rect x="43" y="17" width="1" height="1"/>
  </g>
  <g fill="#243b38">
    <rect x="19" y="17" width="1" height="1"/>
    <rect x="21" y="17" width="1" height="1"/>
    <rect x="23" y="17" width="1" height="1"/>
    <rect x="26" y="17" width="1" height="1"/>
    <rect x="28" y="17" width="1" height="1"/>
    <rect x="30" y="17" width="1" height="1"/>
  </g>
  <!-- Screen (lit) with the diagonal glare -->
  <rect x="6" y="5" width="38" height="10" fill="#35514c"/>
  <g fill="#41625c">
    <rect x="6" y="5" width="2" height="1"/>
    <rect x="6" y="6" width="4" height="1"/>
    <rect x="6" y="7" width="6" height="1"/>
    <rect x="6" y="8" width="8" height="1"/>
    <rect x="6" y="9" width="10" height="1"/>
    <rect x="6" y="10" width="12" height="1"/>
    <rect x="6" y="11" width="14" height="1"/>
    <rect x="6" y="12" width="16" height="1"/>
    <rect x="6" y="13" width="18" height="1"/>
    <rect x="6" y="14" width="20" height="1"/>
