  <rect x="3" y="2" width="44" height="16" fill="#00ffd1"/>
  <rect x="2" y="3" width="46" height="14" fill="#00ffd1"/>
  <rect x="4" y="2" width="42" height="1" fill="#528080"/>
  <rect x="3" y="3" width="44" height="14" fill="#528080"/>
  <rect x="4" y="17" width="42" height="1" fill="#3a5757"/>
  <rect x="4" y="3" width="42" height="13" fill="#8db4ae"/>
  <rect x="4" y="16" width="42" height="1" fill="#627a76"/>
  <rect x="4" y="3" width="1" height="1" fill="#dbf3f0"/>
  <rect x="45" y="3" width="1" height="1" fill="#dbf3f0"/>
  <rect x="4" y="16" width="1" height="1" fill="#dbf3f0"/>
