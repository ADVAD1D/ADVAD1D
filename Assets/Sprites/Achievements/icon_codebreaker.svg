<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- CODEBREAKER achievement icon: generalad.png (55x55) redrawn at 32x32 like the other
       achievement icons. Pointed helmet with the crest and V insignia, glass visor with a
       diagonal glare, chevron on the chin. Same palette as generalad.png. -->
  <!-- Silhouette: cyan outline -->
  <g fill="#00f2ff">
    <rect x="15" y="3" width="2" height="1"/>
    <rect x="13" y="4" width="6" height="1"/>
    <rect x="11" y="5" width="10" height="1"/>
    <rect x="9" y="6" width="14" height="1"/>
    <rect x="7" y="7" width="18" height="1"/>
    <rect x="5" y="8" width="22" height="16"/>
    <rect x="6" y="24" width="20" height="1"/>
    <rect x="8" y="25" width="16" height="1"/>
    <rect x="10" y="26" width="12" height="1"/>
    <rect x="12" y="27" width="8" height="1"/>
    <rect x="14" y="28" width="4" height="1"/>
    <rect x="15" y="29" width="2" height="1"/>
  </g>
  <!-- Black inner outline -->
  <g fill="#000000">
    <rect x="15" y="4" width="2" height="1"/>
    <rect x="13" y="5" width="6" height="1"/>
    <rect x="11" y="6" width="10" height="1"/>
    <rect x="9" y="7" width="14" height="1"/>
    <rect x="7" y="8" width="18" height="1"/>
    <rect x="6" y="9" width="20" height="15"/>
    <rect x="8" y="24" width="16" height="1"/>
    <rect x="10" y="25" width="12" height="1"/>
    <rect x="12" y="26" width="8" height="1"/>
    <rect x="14" y="27" width="4" height="1"/>
    <rect x="15" y="28" width="2" height="1"/>
  </g>
  <!-- Teal bevel of the helmet top -->
  <g fill="#055d63">
    <rect x="15" y="5" width="2" height="1"/>
    <rect x="13" y="6" width="6" height="1"/>
    <rect x="11" y="7" width="10" height="1"/>
    <rect x="9" y="8" width="14" height="1"/>
  </g>
  <!-- Dark fill (left half navy, right half of the top a bit bluer) -->
  <g fill="#000c17">
    <rect x="13" y="7" width="6" height="1"/>
    <rect x="7" y="9" width="18" height="15"/>
    <rect x="9" y="24" width="14" height="1"/>
    <rect x="11" y="25" width="10" height="1"/>
    <rect x="13" y="26" width="6" height="1"/>
  </g>
  <g fill="#02192e">
    <rect x="18" y="7" width="1" height="1"/>
    <rect x="16" y="9" width="8" height="2"/>
  </g>
  <!-- Crest, brim line and the panel around the V insignia -->
  <g fill="#00f2ff">
    <rect x="15" y="6" width="2" height="1"/>
    <rect x="14" y="7" width="4" height="1"/>
    <rect x="11" y="8" width="10" height="1"/>
    <rect x="11" y="9" width="1" height="2"/>
    <rect x="20" y="9" width="1" height="2"/>
  </g>
  <rect x="15" y="8" width="2" height="1" fill="#91f9ff"/>
  <g fill="#00c0cb">
    <rect x="14" y="9" width="1" height="1"/>
    <rect x="17" y="9" width="1" height="1"/>
    <rect x="15" y="10" width="2" height="1"/>
  </g>
  <!-- Side bevels: cyan highlight above and below the visor, near-black beside it -->
  <g fill="#00e2ff">
    <rect x="7" y="9" width="1" height="2"/>
    <rect x="24" y="9" width="1" height="2"/>
    <rect x="7" y="21" width="1" height="2"/>
    <rect x="24" y="21" width="1" height="2"/>
  </g>
  <g fill="#000306">
    <rect x="7" y="11" width="1" height="10"/>
    <rect x="24" y="11" width="1" height="10"/>
  </g>
  <!-- Visor -->
  <g fill="#00f2ff">
    <rect x="8" y="11" width="1" height="1"/>
    <rect x="23" y="11" width="1" height="1"/>
    <rect x="8" y="20" width="1" height="1"/>
    <rect x="23" y="20" width="1" height="1"/>
  </g>
  <rect x="9" y="11" width="7" height="1" fill="#011e23"/>
  <rect x="16" y="11" width="7" height="1" fill="#02323a"/>
  <g fill="#01191d">
    <rect x="8" y="12" width="1" height="8"/>
    <rect x="23" y="12" width="1" height="8"/>
  </g>
  <g fill="#00060c">
    <rect x="9" y="12" width="1" height="1"/>
    <rect x="22" y="12" width="1" height="1"/>
    <rect x="9" y="19" width="1" height="1"/>
    <rect x="22" y="19" width="1" height="1"/>
  </g>
  <g fill="#005863">
    <rect x="9" y="13" width="1" height="6"/>
    <rect x="22" y="13" width="1" height="6"/>
    <rect x="10" y="12" width="4" height="1"/>
    <rect x="20" y="12" width="2" height="1"/>
    <rect x="16" y="19" width="6" height="1"/>
  </g>
  <g fill="#0095a8">
    <rect x="14" y="12" width="6" height="1"/>
    <rect x="10" y="19" width="6" height="1"/>
  </g>
  <rect x="10" y="13" width="12" height="6" fill="#001529"/>
  <rect x="11" y="14" width="10" height="4" fill="#0de6ff"/>
  <g fill="#92eff9">
    <rect x="15" y="14" width="5" height="1"/>
    <rect x="14" y="15" width="5" height="1"/>
    <rect x="13" y="16" width="5" height="1"/>
    <rect x="12" y="17" width="5" height="1"/>
  </g>
  <rect x="9" y="20" width="14" height="1" fill="#011417"/>
  <!-- Chin: chevron and a small mark -->
  <g fill="#000000">
    <rect x="15" y="21" width="2" height="1"/>
    <rect x="14" y="22" width="1" height="1"/>
    <rect x="17" y="22" width="1" height="1"/>
    <rect x="15" y="25" width="2" height="1"/>
  </g>
  <!-- Shading along the chin's edges -->
  <g fill="#00151d">
    <rect x="7" y="23" width="1" height="1"/>
    <rect x="24" y="23" width="1" height="1"/>
    <rect x="9" y="24" width="1" height="1"/>
    <rect x="22" y="24" width="1" height="1"/>
    <rect x="11" y="25" width="1" height="1"/>
    <rect x="20" y="25" width="1" height="1"/>
    <rect x="13" y="26" width="1" height="1"/>
    <rect x="18" y="26" width="1" height="1"/>
    <rect x="15" y="27" width="2" height="1"/>
  </g>
