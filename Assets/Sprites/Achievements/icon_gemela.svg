<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- GEMELA DOWN achievement icon: the boss at 32x32 (Assets/Sprites/Enemies/Boss/):
       ring with six red vents, the star inside it, and the head with its two cannons. -->
  <!-- Ring -->
  <circle cx="16" cy="16" r="15" fill="#000000"/>
  <circle cx="16" cy="16" r="14" fill="#4a4f55"/>
  <circle cx="16" cy="16" r="13" fill="#5c646c"/>
  <!-- Vents -->
  <g fill="#ff2a3d">
    <rect x="26" y="15" width="3" height="2"/>
    <rect x="3" y="15" width="3" height="2"/>
    <rect x="20" y="5" width="2" height="2"/>
    <rect x="10" y="5" width="2" height="2"/>
    <rect x="20" y="25" width="2" height="2"/>
    <rect x="10" y="25" width="2" height="2"/>
  </g>
  <!-- Inside of the ring -->
  <circle cx="16" cy="16" r="10" fill="#000000"/>
  <circle cx="16" cy="16" r="9" fill="#1c1f22"/>
  <!-- Star -->
  <polygon points="16,8 18,14 24,16 18,18 16,24 14,18 8,16 14,14" fill="#7a828a"/>
  <!-- Head: the two cannons -->
  <rect x="14" y="3" width="4" height="26" fill="#000000"/>
  <rect x="15" y="4" width="2" height="24" fill="#5c646c"/>
  <rect x="15" y="4" width="2" height="1" fill="#ff2a3d"/>
  <rect x="15" y="27" width="2" height="1" fill="#ff2a3d"/>
  <!-- Head: the core -->
  <circle cx="16" cy="16" r="5" fill="#000000"/>
  <circle cx="16" cy="16" r="4" fill="#2b2f33"/>
  <rect x="14" y="15" width="4" height="2" fill="#ff2a3d"/>
  <rect x="15" y="15" width="1" height="1" fill="#ffb0b8"/>
</svg>
