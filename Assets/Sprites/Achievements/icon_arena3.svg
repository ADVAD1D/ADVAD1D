<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- FINAL FRONTIER achievement icon (reach arena 3): a screen plate with "03", like
       icon_arena2.png, in arena 3's red. -->
  <!-- Black outline with the top tab -->
  <g fill="#000000">
    <rect x="11" y="2" width="10" height="3"/>
    <rect x="5" y="4" width="22" height="25"/>
  </g>
  <!-- Bright red frame -->
  <g fill="#ff2a3d">
    <rect x="12" y="3" width="8" height="2"/>
    <rect x="6" y="5" width="20" height="23"/>
  </g>
  <!-- Dark screen -->
  <rect x="7" y="6" width="18" height="21" fill="#000000"/>
  <rect x="8" y="7" width="16" height="19" fill="#3a0508"/>
  <!-- Scanlines -->
  <g fill="#4a0a0f">
    <rect x="8" y="8" width="16" height="1"/>
    <rect x="8" y="10" width="16" height="1"/>
    <rect x="8" y="22" width="16" height="1"/>
    <rect x="8" y="24" width="16" height="1"/>
  </g>
  <!-- Digit shadow (one pixel down) -->
  <g fill="#9a0c1a">
    <rect x="9" y="12" width="6" height="2"/>
    <rect x="9" y="20" width="6" height="2"/>
    <rect x="9" y="12" width="2" height="10"/>
    <rect x="13" y="12" width="2" height="10"/>
    <rect x="17" y="12" width="6" height="2"/>
    <rect x="18" y="16" width="5" height="2"/>
    <rect x="17" y="20" width="6" height="2"/>
    <rect x="21" y="12" width="2" height="10"/>
  </g>
  <!-- "03" -->
  <g fill="#ff4a5a">
    <rect x="9" y="11" width="6" height="2"/>
    <rect x="9" y="19" width="6" height="2"/>
    <rect x="9" y="11" width="2" height="10"/>
    <rect x="13" y="11" width="2" height="10"/>
    <rect x="17" y="11" width="6" height="2"/>
    <rect x="18" y="15" width="5" height="2"/>
    <rect x="17" y="19" width="6" height="2"/>
    <rect x="21" y="11" width="2" height="10"/>
  </g>
</svg>
