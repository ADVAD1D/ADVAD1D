name: Export Android (APK/AAB)

on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1-stable
  GODOT_EXECUTABLE_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
  GODOT_TEMPLATES_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
  EXPORT_TEMPLATE_DIR: 4.7.1.stable

jobs:
  export-android:
    name: Export Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java (Required for Android Export)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Install Godot
        run: |
          echo "Downloading Godot Engine..."
          wget -q "${GODOT_EXECUTABLE_URL}" -O godot.zip
          unzip godot.zip
          sudo mv Godot_v*linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Download and Install Export Templates
        run: |
          echo "Downloading Export Templates..."
          wget -q "${GODOT_TEMPLATES_URL}" -O templates.tpz
          unzip templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${EXPORT_TEMPLATE_DIR}
          mv templates/* ~/.local/share/godot/export_templates/${EXPORT_TEMPLATE_DIR}/

      - name: Generate Automatic Keystore for Signing
        run: |
          echo "Generating an automatic keystore to sign the APK..."
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore auto_sign.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Inject Export Presets
        env:
          PRESETS_FILE: ${{ secrets.EXPORT_PRESETS_CFG }}
        run: |
          echo "Create and inject export_presets.cfg from secrets..."
          printf "%s\n" "$PRESETS_FILE" > export_presets.cfg
          
          # Inject the automatic keystore and disable the splash screen
          awk -v path="$(pwd)/auto_sign.keystore" '
          /^name="Android"/ { in_android = 1 }
          /^\[preset\.[0-9]+\.options\]$/ { 
              if (in_android) { 
                  print; 
                  print "keystore/release=\"" path "\""; 
                  print "keystore/release_user=\"androiddebugkey\""; 
                  print "keystore/release_password=\"android\""; 
                  print "splash_screen/disable_godot_boot_splash=true"; 
                  in_android_options = 1; 
                  next; 
              } 
          }
          /^\[/ { in_android_options = 0; in_android = 0 }
          { 
              if (in_android_options) {
                  if ($0 ~ /^keystore\/release=/ || $0 ~ /^keystore\/release_user=/ || $0 ~ /^keystore\/release_password=/ || $0 ~ /^splash_screen\/disable_godot_boot_splash=/) {
                      next; # Remove original keys to prevent duplicates
                  }
              }
              print 
          }
          ' export_presets.cfg > tmp_presets.cfg && mv tmp_presets.cfg export_presets.cfg

      - name: Inject Environment Variables (.env)
        env:
          MY_APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          echo "Fabric file from .env secrets..."
          echo "APP_TOKEN=$MY_APP_TOKEN" > .env

      - name: Import Godot Assets
        run: |
          echo "Importing assets for the first time..."
          godot --headless --editor --quit || true
          echo "Second pass of importation (necessary for heavy audio in Godot 4)..."
          godot --headless --editor --quit || true

      - name: Export Android Build
        run: |
          echo "Exporting Android version..."
          mkdir -p build_android
          godot --headless --export-release "Android" build_android/advad.apk

      - name: Upload to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-apk
          path: build_android
